{% extends 'base.html' %}

{% block title %}Login | Chess Learning Platform{% endblock %}

{% block content %}
<div class="auth-panel reveal">
    <div class="card">
        <div class="card-body p-4 form-shell">
            <h1 class="auth-heading">Welcome back</h1>
            <p class="auth-subheading">Sign in to continue your lessons and track progress.</p>
            <form method="post" novalidate>
                {% csrf_token %}
                {% include 'partials/form_fields.html' with form=form %}
                <button class="btn btn-brand" type="submit">Login</button>
            </form>
            <p class="small mt-3 mb-0">No account yet? <a href="{% url 'users:signup' %}">Create one</a></p>
        </div>
    </div>
</div>
{% endblock %}
