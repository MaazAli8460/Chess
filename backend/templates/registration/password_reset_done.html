{% extends "base.html" %}

{% block page_title %}Password Reset Sent — ChessLearn{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 text-center">
    <div class="mb-4" style="font-size:3rem;">&#128231;</div>
    <h1 class="h3 mb-3">Check your inbox</h1>

    <a href="{% url 'login' %}" class="btn btn-brand-outline">Back to Login</a>
  </div>
</div>
{% endblock %}
